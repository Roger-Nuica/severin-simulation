<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-label="Heavy scenario: CPU per frame by section">
  <style>
    .bg { fill: #fcfcfb; }
    .t1 { fill: #0b0b0b; font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .t2 { fill: #52514e; font: 12px system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .lab { fill: #0b0b0b; font: 12px system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .val { fill: #52514e; font: 11px ui-monospace, Menlo, Consolas, monospace; }
    .grid { stroke: #e4e3df; stroke-width: 1; }
    .before { fill: #b9b8b2; }
    .after { fill: #2a78d6; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .t1, .lab { fill: #ffffff; }
      .t2, .val { fill: #c3c2b7; }
      .grid { stroke: #383835; }
      .before { fill: #5c5b57; }
      .after { fill: #3987e5; }
    }
