name: Coder Plan Subtask (Guarded)

on:
  schedule:
    # GitHub cron is UTC.
    # Two separate entries, because github.event.schedule holds the exact cron
    # string that fired. The gate below selects the one that corresponds to
    # 03:00 Europe/Bucharest, including DST.
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"

  workflow_dispatch:
    inputs:
      plan_file:
        description: "Checked-in plan to work from"
        required: true
        type: choice
        options:
          - PLAN_katana_subtasks.md
        default: PLAN_katana_subtasks.md

      subtask:
        description: "Optional exact subtask number. Leave empty to run the first dependency-ready incomplete subtask."
        required: false
        type: string
        default: ""

      branch_name:
        description: "Optional new branch name; leave empty for an automatic unique branch"
        required: false
        type: string
        default: ""

concurrency:
  group: coder-plan-${{ inputs.plan_file || 'PLAN_katana_subtasks.md' }}
  cancel-in-progress: false

jobs:
  run-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Gate schedule to 03:00 Europe/Bucharest
        id: schedule_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "scheduled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine which UTC hour corresponds to 03:00 Bucharest today.
          # On the DST fall-back day, 03:00 can occur twice; select the first.
          expected_utc_hour="$(
          python3 <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          zone = ZoneInfo("Europe/Bucharest")
          today = datetime.now(zone).date()
          local_target = datetime(today.year, today.month, today.day, 3, 0, 0)

          candidates = []
          for fold in (0, 1):
              aware = local_target.replace(tzinfo=zone, fold=fold)
              utc = aware.astimezone(timezone.utc)

              # Keep only real local times. This excludes nonexistent DST times.
              back = utc.astimezone(zone).replace(tzinfo=None)
              if back == local_target:
                  candidates.append(utc)

          if not candidates:
              # 03:00 does not exist on the DST spring-forward date.
              print("none")
          else:
              print(min(candidates).hour)
          PY
          )"

          if [[ "$expected_utc_hour" == "none" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "scheduled=true" >> "$GITHUB_OUTPUT"
            echo "03:00 Europe/Bucharest does not exist today because of DST; skipping."
            exit 0
          fi

          expected_schedule="0 ${expected_utc_hour} * * *"

          echo "Triggered cron: $SCHEDULE"
          echo "Expected cron:  $expected_schedule"

          if [[ "$SCHEDULE" == "$expected_schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "scheduled=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "scheduled=true" >> "$GITHUB_OUTPUT"
            echo "This is the adjacent UTC cron tick; skipping."
          fi

      - name: Validate plan and branch inputs
        id: target
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_INPUT: ${{ inputs.plan_file }}
          SUBTASK_INPUT: ${{ inputs.subtask }}
          BRANCH_INPUT: ${{ inputs.branch_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            plan_file="PLAN_katana_subtasks.md"
            requested_subtask=""
            run_all="false"
            branch_name="auto/katana-subtasks-run-${RUN_ID}-${RUN_ATTEMPT}"
          else
            plan_file="$PLAN_INPUT"
            requested_subtask="$SUBTASK_INPUT"

            case "$plan_file" in
              PLAN_katana_subtasks.md)
                ;;
              *)
                echo "Unsupported plan path: $plan_file" >&2
                exit 1
                ;;
            esac

            if [[ -n "$requested_subtask" && ! "$requested_subtask" =~ ^[0-9]+$ ]]; then
              echo "Subtask must be empty or contain exactly one numeric subtask number." >&2
              exit 1
            fi

            if [[ -z "$requested_subtask" ]]; then
              run_all="true"
            else
              run_all="false"
            fi

            if [[ -n "$BRANCH_INPUT" ]]; then
              branch_name="$BRANCH_INPUT"
              git check-ref-format --branch "$branch_name"
            else
              slug="${plan_file#PLAN_}"
              slug="${slug%.md}"
              branch_name="auto/${slug}-run-${RUN_ID}-${RUN_ATTEMPT}"
            fi
          fi

          printf 'plan_file=%s\n' "$plan_file" >> "$GITHUB_OUTPUT"
          printf 'requested_subtask=%s\n' "$requested_subtask" >> "$GITHUB_OUTPUT"
          printf 'run_all=%s\n' "$run_all" >> "$GITHUB_OUTPUT"
          printf 'branch_name=%s\n' "$branch_name" >> "$GITHUB_OUTPUT"

      - name: Checkout default branch
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create new isolated branch from default branch
        id: branch
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          BRANCH_NAME: ${{ steps.target.outputs.branch_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "coder-auto-bot"
          git config user.email "coder-auto-bot@users.noreply.github.com"

          git fetch origin "$DEFAULT_BRANCH"

          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Branch already exists: $BRANCH_NAME" >&2
            echo "This workflow requires a new branch for every run." >&2
            exit 1
          fi

          git switch -c "$BRANCH_NAME" "origin/$DEFAULT_BRANCH"

      - name: Select approved dependency-ready subtasks
        id: select
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          PLAN_FILE: ${{ steps.target.outputs.plan_file }}
          REQUESTED_SUBTASK: ${{ steps.target.outputs.requested_subtask }}
          RUN_ALL: ${{ steps.target.outputs.run_all }}
          IS_SCHEDULED: ${{ steps.schedule_gate.outputs.scheduled }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const planPath = process.env.PLAN_FILE;
          const text = fs.readFileSync(planPath, 'utf8');

          const headings = [
            ...text.matchAll(/^- \[([ x])\](?: DONE)? \*\*Subtask (\d+)[^\n]*$/gm),
          ];

          const tasks = new Map();
          const taskOrder = [];

          for (let i = 0; i < headings.length; i++) {
            const match = headings[i];
            const end = i + 1 < headings.length ? headings[i + 1].index : text.length;
            const block = text.slice(match.index, end);
            const depsLine = block.match(/^\s+-?\s*Depends on:\s*(.*)$/mi);
            const deps = depsLine
              ? (depsLine[1].match(/\d+/g) || []).map(Number)
              : [];

            const id = Number(match[2]);

            tasks.set(id, {
              done: match[1] === 'x',
              deps,
            });

            taskOrder.push(id);
          }

          if (tasks.size === 0) {
            throw new Error(`No subtask headings were found in ${planPath}`);
          }

          const scheduled = process.env.IS_SCHEDULED === 'true';
          const runAll = process.env.RUN_ALL === 'true';
          const requested = process.env.REQUESTED_SUBTASK;
          let selected = [];

          // Scheduled runs remain intentionally restricted to Katana 14 and 15.
          if (scheduled) {
            const id = [14, 15].find(id => tasks.has(id) && !tasks.get(id).done);

            if (!id) {
              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                `No scheduled Katana subtask remains in ${planPath}. Schedule covers only subtasks 14 and 15.\n`,
              );
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'run=false\n');
              process.exit(0);
            }

            const incomplete = tasks.get(id).deps.filter(dep => !tasks.get(dep)?.done);

            if (incomplete.length > 0) {
              throw new Error(
                `Scheduled subtask ${id} has incomplete dependencies: ${incomplete.join(', ')}`,
              );
            }

            selected = [id];
          } else if (!runAll) {
            const id = Number(requested);
            const task = tasks.get(id);

            if (!task) {
              throw new Error(`Subtask ${id} was not found in ${planPath}`);
            }

            if (task.done) {
              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                `Subtask ${id} is already marked DONE in ${planPath}; nothing to run.\n`,
              );
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'run=false\n');
              process.exit(0);
            }

            const incomplete = task.deps.filter(dep => !tasks.get(dep)?.done);

            if (incomplete.length > 0) {
              throw new Error(
                `Subtask ${id} has incomplete dependencies: ${incomplete.join(', ')}`,
              );
            }

            selected = [id];
          } else {
            // One subtask per run: the first incomplete task, in plan order,
            // whose dependencies are all done.
            const id = taskOrder.find(
              candidate =>
                !tasks.get(candidate).done &&
                tasks.get(candidate).deps.every(dep => tasks.get(dep)?.done),
            );

            if (id === undefined) {
              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                `No dependency-ready incomplete subtasks were found in ${planPath}.\n`,
              );
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'run=false\n');
              process.exit(0);
            }

            selected = [id];
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `run=true\nsubtasks=${selected.join(',')}\n`,
          );

          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `Selected subtasks from ${planPath}: ${selected.join(', ')}\n`,
          );
          NODE

      - name: Set up Node
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true'
        run: npm ci

      - name: Require Anthropic API secret
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "Repository secret ANTHROPIC_API_KEY is required." >&2
            exit 1
          fi

      - name: Run Claude Code Action on one approved subtask
        id: claude
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Required for an autonomous GitHub runner.
          # Without this, Claude can inspect files but may deny edits and commands.
          claude_args: --max-turns 40 --permission-mode bypassPermissions

          # Makes it possible to see the actual reason if Claude stops or is blocked.
          show_full_output: true

          prompt: |
            Use the Coder role in .claude/agents/coder.md and the coder-plan-run
            workflow in .claude/skills/coder-plan-run/SKILL.md.

            Implement ONLY subtask ${{ steps.select.outputs.subtasks }} from
            ${{ steps.target.outputs.plan_file }}. This workflow handles exactly
            one subtask per Coder run. Do not batch tasks and do not advance to
            another subtask.

            Verify all dependencies and acceptance criteria before editing.

            Follow every fixed safety gate in:
            .claude/skills/full-autonomous-run/SKILL.md

            Read applicable .claude/rules.md entries and relevant SKILL.md files.
            Treat runtime code as the source of truth for implemented values.

            Stop and record BLOCKED if a decision gate or unresolved approval is
            encountered.

            Do not raise existing caps. Do not modify unrelated files.

            Mark a selected plan subtask as [x] DONE only after that specific subtask's
            acceptance criteria and focused checks pass.

            Write STATUS_AUTO_RUN.md containing:
            - selected task number;
            - status: DONE, STOPPED, or BLOCKED;
            - changed files;
            - checks run and their results;
            - any decision still needed.

            Keep the completion note to 3-4 bullets.

            Run npm run lint and npm run build before marking DONE.
            If either fails, report the exact failure and do not leave the subtask
            marked DONE.

            Do not claim browser or manual visual checks on this headless runner.
            Katana subtask 16 contains manual acceptance checks and must remain
            incomplete unless every required manual check was actually performed.

      - name: Show Claude changes
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true'
        run: |
          echo "Git working tree after Claude:"
          git status --short

          if [[ -f STATUS_AUTO_RUN.md ]]; then
            echo ""
            echo "STATUS_AUTO_RUN.md:"
            cat STATUS_AUTO_RUN.md
          fi

      - name: Run lint
        id: lint
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true'
        continue-on-error: true
        run: npm run lint

      - name: Run production build
        id: build
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true'
        continue-on-error: true
        run: npm run build

      - name: Record failed repository gates and unmark subtask
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true' && (steps.lint.outcome == 'failure' || steps.build.outcome == 'failure')
        env:
          PLAN_FILE: ${{ steps.target.outputs.plan_file }}
          SUBTASK: ${{ steps.select.outputs.subtasks }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const planPath = process.env.PLAN_FILE;
          const id = process.env.SUBTASK;
          const plan = fs.readFileSync(planPath, 'utf8');

          const heading = new RegExp(
            `^- \\[x\\](?: DONE)? \\*\\*Subtask ${id}\\b[^\\n]*$`,
            'm',
          );

          const match = plan.match(heading);

          if (match) {
            const updated = plan.replace(
              heading,
              match[0].replace(/^- \[x\](?: DONE)?/, '- [ ]'),
            );
            fs.writeFileSync(planPath, updated);
          }

          const failures = [];

          if (process.env.LINT_OUTCOME === 'failure') {
            failures.push('npm run lint failed');
          }

          if (process.env.BUILD_OUTCOME === 'failure') {
            failures.push('npm run build failed');
          }

          fs.appendFileSync(
            'STATUS_AUTO_RUN.md',
            `\n## Subtask ${id} validation gate\n- Status: BLOCKED\n- Reason: ${failures.join('; ')}. The subtask is not marked DONE.\n`,
          );
          NODE

      - name: Commit run results
        id: commit
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true'
        env:
          PLAN_FILE: ${{ steps.target.outputs.plan_file }}
          BRANCH_NAME: ${{ steps.target.outputs.branch_name }}
          SUBTASK: ${{ steps.select.outputs.subtasks }}
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "No changes were produced by the Coder run."
            echo "changed=false" >> "$GITHUB_OUTPUT"

            {
              echo "## Automated Coder run"
              echo ""
              echo "- Subtask: ${SUBTASK}"
              echo "- Result: no repository changes were produced"
              echo "- No branch was pushed and no PR was created"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          git diff --cached --check
          git commit -m "Auto-run: ${PLAN_FILE} subtasks ${SUBTASK}"
          git push --set-upstream origin "$BRANCH_NAME"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.target.outputs.branch_name }}
          PLAN_FILE: ${{ steps.target.outputs.plan_file }}
          SUBTASK: ${{ steps.select.outputs.subtasks }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          body="$(cat <<EOF
          Automated Coder run for \`${PLAN_FILE}\`, subtasks \`${SUBTASK}\`.

          Please review \`STATUS_AUTO_RUN.md\`, the implementation, and all checks
          before merging. Safety gates and unresolved approvals are not bypassed.
          EOF
          )"

          gh pr create \
            --title "Auto-run: ${PLAN_FILE} subtasks ${SUBTASK}" \
            --body "$body" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME"