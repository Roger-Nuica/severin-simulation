name: Coder Plan Subtask (Guarded)

on:
  schedule:
    # GitHub cron is UTC. Run at both adjacent UTC hours and gate to 03:00
    # Europe/Bucharest so the schedule stays correct across DST changes.
    - cron: "0 0,1 * * *"
  workflow_dispatch:
    inputs:
      plan_file:
        description: "Checked-in plan to work from"
        required: true
        type: choice
        options:
          - PLAN_katana_subtasks.md
          - PLAN_coop.md
        default: PLAN_katana_subtasks.md
      subtask:
        description: "One exact subtask number to run (not a comma-separated list)"
        required: true
        type: string
        default: "14"
      branch_name:
        description: "Optional isolated work branch; leave empty to derive it from the plan"
        required: false
        type: string
        default: ""

concurrency:
  group: coder-plan-${{ inputs.plan_file || 'katana-subtasks' }}
  cancel-in-progress: false

jobs:
  run-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Gate schedule to 03:00 Europe/Bucharest
        id: schedule_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "scheduled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_hour="$(TZ=Europe/Bucharest date +%H)"
          if [[ "$local_hour" == "03" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "scheduled=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "scheduled=true" >> "$GITHUB_OUTPUT"
            echo "Not 03:00 Europe/Bucharest; skipping this UTC schedule tick."
          fi

      - name: Validate plan and branch inputs
        id: target
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_INPUT: ${{ inputs.plan_file }}
          SUBTASK_INPUT: ${{ inputs.subtask }}
          BRANCH_INPUT: ${{ inputs.branch_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            plan_file="PLAN_katana_subtasks.md"
            requested_subtask=""
            branch_name="auto/katana-subtasks"
          else
            plan_file="$PLAN_INPUT"
            requested_subtask="$SUBTASK_INPUT"
            case "$plan_file" in
              PLAN_katana_subtasks.md|PLAN_coop.md) ;;
              *) echo "Unsupported plan path: $plan_file" >&2; exit 1 ;;
            esac
            if [[ ! "$requested_subtask" =~ ^[0-9]+$ ]]; then
              echo "Enter exactly one numeric subtask number." >&2
              exit 1
            fi
            if [[ -n "$BRANCH_INPUT" ]]; then
              branch_name="$BRANCH_INPUT"
              git check-ref-format --branch "$branch_name"
            else
              slug="${plan_file#PLAN_}"
              slug="${slug%.md}"
              branch_name="auto/$slug"
            fi
          fi
          printf 'plan_file=%s\n' "$plan_file" >> "$GITHUB_OUTPUT"
          printf 'requested_subtask=%s\n' "$requested_subtask" >> "$GITHUB_OUTPUT"
          printf 'branch_name=%s\n' "$branch_name" >> "$GITHUB_OUTPUT"

      - name: Checkout default branch
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create or resume isolated work branch
        id: branch
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          BRANCH_NAME: ${{ steps.target.outputs.branch_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "coder-auto-bot"
          git config user.email "coder-auto-bot@users.noreply.github.com"
          git fetch origin "$DEFAULT_BRANCH"
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            git fetch origin "$BRANCH_NAME"
            git switch --track -c "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            git switch -c "$BRANCH_NAME" "origin/$DEFAULT_BRANCH"
          fi

      - name: Select exactly one dependency-ready subtask
        id: select
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          PLAN_FILE: ${{ steps.target.outputs.plan_file }}
          REQUESTED_SUBTASK: ${{ steps.target.outputs.requested_subtask }}
          IS_SCHEDULED: ${{ steps.schedule_gate.outputs.scheduled }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const planPath = process.env.PLAN_FILE;
          const text = fs.readFileSync(planPath, 'utf8');
          const headings = [...text.matchAll(/^- \[([ x])\](?: DONE)? \*\*Subtask (\d+)[^\n]*$/gm)];
          const tasks = new Map();
          for (let i = 0; i < headings.length; i++) {
            const match = headings[i];
            const end = i + 1 < headings.length ? headings[i + 1].index : text.length;
            const block = text.slice(match.index, end);
            const depsLine = block.match(/^\s+-?\s*Depends on:\s*(.*)$/mi);
            const deps = depsLine ? (depsLine[1].match(/\d+/g) || []).map(Number) : [];
            tasks.set(Number(match[2]), { done: match[1] === 'x', deps });
          }
          const scheduled = process.env.IS_SCHEDULED === 'true';
          let id;
          if (scheduled) {
            id = [14, 15].find(candidate => tasks.has(candidate) && !tasks.get(candidate).done);
            if (!id) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `No scheduled Katana subtask remains in ${planPath} (schedule covers 14 and 15 only).\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'run=false\n');
              process.exit(0);
            }
          } else {
            id = Number(process.env.REQUESTED_SUBTASK);
          }
          const task = tasks.get(id);
          if (!task) throw new Error(`Subtask ${id} not found in ${planPath}`);
          if (task.done) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Subtask ${id} is already marked complete in ${planPath}; nothing to run.\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'run=false\n');
            process.exit(0);
          }
          const incomplete = task.deps.filter(dep => !tasks.get(dep)?.done);
          if (scheduled && incomplete.length) {
            throw new Error(`Scheduled subtask ${id} has incomplete dependencies: ${incomplete.join(', ')}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run=true\nsubtask=${id}\n`);
          NODE

      - name: Set up Node
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true'
        run: npm ci

      - name: Require Anthropic API secret
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "Repository secret ANTHROPIC_API_KEY is required." >&2
            exit 1
          fi

      - name: Run Claude Code Action on one approved subtask
        id: claude
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --max-turns 40
          prompt: |
            Use the Coder role in .claude/agents/coder.md and the coder-plan-run
            workflow in .claude/skills/coder-plan-run/SKILL.md.

            Implement ONLY subtask ${{ steps.select.outputs.subtask }} from
            ${{ steps.target.outputs.plan_file }}. This workflow dispatch handles
            one subtask per Coder run; do not batch or advance to another task.
            Verify its dependencies and acceptance criteria before editing.

            Follow every fixed safety gate in
            .claude/skills/full-autonomous-run/SKILL.md. Read the applicable
            .claude/rules.md entries and relevant SKILL.md files. Treat runtime
            code as the source of truth for implemented values. Stop and record
            BLOCKED if a decision gate or unresolved approval is encountered;
            PLAN_coop.md Subtask 1 is a clarification/approval gate, not permission
            to invent the ten listed Co-op decisions or implement later subtasks.

            Do not raise existing caps or modify unrelated files. Mark the selected
            plan subtask [x] DONE only after its acceptance criteria and focused
            checks pass. Write STATUS_AUTO_RUN.md with the selected task number,
            status (DONE, STOPPED, or BLOCKED), changed files, checks and results,
            and any decision needed. Keep the completion note to 3-4 bullets.

            Run npm run lint and npm run build before marking DONE. If either fails,
            report the exact failure and do not leave this subtask marked DONE.
            Do not claim browser/manual visual checks on this headless runner.
            Katana subtask 16 contains manual acceptance checks and must remain
            incomplete unless every required manual check has actually been run.

      - name: Run lint
        id: lint
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true'
        continue-on-error: true
        run: npm run lint

      - name: Run production build
        id: build
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true'
        continue-on-error: true
        run: npm run build

      - name: Record failed repository gates and unmark subtask
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true' && (steps.lint.outcome == 'failure' || steps.build.outcome == 'failure')
        env:
          PLAN_FILE: ${{ steps.target.outputs.plan_file }}
          SUBTASK: ${{ steps.select.outputs.subtask }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const planPath = process.env.PLAN_FILE;
          const id = process.env.SUBTASK;
          const plan = fs.readFileSync(planPath, 'utf8');
          const heading = new RegExp(`^- \\[x\\](?: DONE)? \\*\\*Subtask ${id}\\b[^\\n]*$`, 'm');
          const match = plan.match(heading);
          if (match) fs.writeFileSync(planPath, plan.replace(heading, match[0].replace(/^- \[x\](?: DONE)?/, '- [ ]')));
          const failures = [];
          if (process.env.LINT_OUTCOME === 'failure') failures.push('npm run lint failed');
          if (process.env.BUILD_OUTCOME === 'failure') failures.push('npm run build failed');
          fs.appendFileSync('STATUS_AUTO_RUN.md', `\n## Subtask ${id} validation gate\n- Status: BLOCKED\n- Reason: ${failures.join('; ')}. The subtask is not marked DONE.\n`);
          NODE

      - name: Commit run results
        id: commit
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true'
        env:
          PLAN_FILE: ${{ steps.target.outputs.plan_file }}
          BRANCH_NAME: ${{ steps.target.outputs.branch_name }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --check
            git commit -m "Auto-run: ${PLAN_FILE} subtask ${{ steps.select.outputs.subtask }}"
            git push origin "$BRANCH_NAME"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.schedule_gate.outputs.run == 'true' && steps.select.outputs.run == 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.target.outputs.branch_name }}
          PLAN_FILE: ${{ steps.target.outputs.plan_file }}
          SUBTASK: ${{ steps.select.outputs.subtask }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          pr_number="$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number // empty')"
          body="Automated Coder run for ${PLAN_FILE}, subtask ${SUBTASK}. Review STATUS_AUTO_RUN.md and all changes before merging. Safety gates and unresolved approvals are not bypassed."
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --body "$body"
          else
            gh pr create \
              --title "Auto-run: ${PLAN_FILE} subtask ${SUBTASK}" \
              --body "$body" \
              --base "$BASE_BRANCH" \
              --head "$BRANCH_NAME"
          fi
